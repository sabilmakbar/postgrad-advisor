[project]
name = "postgrad-advisor"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = [
    "ddgs>=9.16.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain>=1.3.18",
    "langchain-google-genai>=4.3.7",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.6.0",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.11",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.16.2",
    "uvicorn>=0.52.4",
]

[dependency-groups]
data = [
    "openpyxl>=3.1.5",
]
dev = [
    {include-group = "data"},
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
