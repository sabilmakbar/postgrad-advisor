<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Postgrad Advisor</title>
<!-- Inline icon: stops the browser's /favicon.ico probe 404ing in the server log,
     without adding a route or a binary asset. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%93%3C/text%3E%3C/svg%3E">
<!-- theme before paint, so a dark page never flashes white (site Base.astro pattern) -->
<script>
  (function () {
    const t = localStorage.getItem("theme");
    const dark = t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.classList.toggle("dark", dark);
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Design tokens ported from the personal site (src/styles/global.css) —
     values only: that site is Tailwind, this page is one plain file (AD-1). */
  :root {
    --bg: #fafaf9;
    --surface: #ffffff;
    --fg: #18181b;
    --muted: #57534e;
    --border: #e7e5e4;
    --accent: #0d9488;
    --accent-fg: #ffffff;
    --danger: #b91c1c;
  }
  .dark {
    --bg: #0b0c0e;
    --surface: #141619;
    --fg: #e8e8ea;
    --muted: #a1a1aa;
    --border: #26272b;
    --accent: #2dd4bf;
    --accent-fg: #0b0c0e;
    --danger: #fca5a5;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0 auto;
    max-width: 46rem;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: 0 1rem;
    background: var(--bg);
    color: var(--fg);
    font: 400 16px/1.55 "Inter", ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--accent); color: var(--accent-fg); }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: .9rem 0;
    border-bottom: 1px solid var(--border);
  }
  h1 { margin: 0; font-size: 1.05rem; font-weight: 600; letter-spacing: -0.02em; }
  header p { margin: .15rem 0 0; font-size: .78rem; color: var(--muted); }
  #theme {
    flex: none;
    width: 2.25rem; height: 2.25rem;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--border); border-radius: .6rem;
    background: var(--surface); color: var(--muted);
    cursor: pointer; transition: color .15s, border-color .15s;
  }
  #theme:hover { color: var(--accent); border-color: var(--accent); }

  /* message list ------------------------------------------------------- */
  #log {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 1rem 0;
    display: flex;
    flex-direction: column;
    gap: .6rem;
  }
  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .row.error { flex-direction: column; align-items: flex-start; gap: .4rem; }
  .bubble {
    max-width: 90%;
    padding: .5rem .75rem;          /* px-3 py-2 */
    border-radius: .75rem;          /* rounded-xl */
    white-space: pre-wrap;
    overflow-wrap: break-word;
  }
  /* the site widget puts bg-bg bubbles on a bg-surface panel; this page's body
     is --bg, so agent bubbles take --surface: same pair, inverted. */
  .ai .bubble { background: var(--surface); border: 1px solid var(--border); }
  .user .bubble { background: var(--accent); color: var(--accent-fg); }
  .error .bubble {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid var(--danger);
    color: var(--muted);
    font-size: .95rem;
  }
  .retry {
    padding: .3rem .7rem;
    border: 1px solid var(--border); border-radius: .6rem;
    background: transparent; color: var(--accent);
    font: inherit; font-size: .85rem; cursor: pointer;
    transition: border-color .15s;
  }
  .retry:hover { border-color: var(--accent); }
  .row.trace { color: var(--muted); font-size: .78rem; opacity: .72; }
  .row.trace .bubble { padding: 0 .75rem; }
  .turn-trace { display: block; color: var(--muted); font-size: .78rem; opacity: .72; }

  /* pending-turn placeholder: dots + a rotating line (global.css:60-81) --- */
  .ph { display: inline-flex; align-items: center; gap: .5rem; color: var(--muted); }
  .typing { display: inline-flex; align-items: center; gap: .28rem; height: 1.25rem; }
  .typing i {
    width: .4rem; height: .4rem; border-radius: 9999px;
    background: var(--accent);
    animation: typing-bounce 1.2s ease-in-out infinite;
  }
  .typing i:nth-child(2) { animation-delay: .15s; }
  .typing i:nth-child(3) { animation-delay: .3s; }
  @keyframes typing-bounce {
    0%, 80%, 100% { transform: translateY(0); opacity: .35; }
    40% { transform: translateY(-4px); opacity: 1; }
  }

  /* composer ------------------------------------------------------------ */
  form {
    display: flex;
    flex-direction: column;   /* attachment chip row above the input row */
    gap: .4rem;
    padding: .5rem;
    margin-bottom: calc(.75rem + env(safe-area-inset-bottom));
    border: 1px solid var(--border);
    border-radius: .9rem;
    background: var(--surface);
  }
  .composer { display: flex; align-items: flex-end; gap: .5rem; }
  /* attachment chip: the file is held here until the user presses Send (AC 1) */
  #chip {
    align-self: flex-start;
    display: flex; align-items: center; gap: .4rem;
    max-width: 100%;
    padding: .25rem .3rem .25rem .55rem;
    border: 1px solid var(--border); border-radius: .6rem;
    background: var(--bg); color: var(--muted); font-size: .82rem;
  }
  #chip[hidden] { display: none; }
  #chipname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #chipx {
    flex: none;
    width: 1.35rem; height: 1.35rem; line-height: 1;
    border: 0; border-radius: .4rem;
    background: transparent; color: var(--muted);
    font: inherit; font-size: 1rem; cursor: pointer;
  }
  #chipx:hover { color: var(--danger); }
  #msg {
    flex: 1;
    min-width: 0;
    max-height: 8rem;
    resize: none;
    border: 0;
    outline: none;
    background: transparent;
    color: var(--fg);
    font: inherit;
    padding: .4rem .3rem;
  }
  #msg::placeholder { color: var(--muted); }
  #send {
    flex: none;
    padding: .5rem 1rem;
    border: 0; border-radius: .6rem;
    background: var(--accent); color: var(--accent-fg);
    font: inherit; font-weight: 500; cursor: pointer;
  }
  #send:disabled, #msg:disabled { opacity: .5; cursor: default; }
  label {
    flex: none;
    padding: .5rem .7rem;
    border: 1px solid var(--border); border-radius: .6rem;
    color: var(--muted); font-size: .85rem; cursor: pointer;
    transition: color .15s, border-color .15s;
  }
  label:hover { color: var(--accent); border-color: var(--accent); }
  #cv { display: none; }

  @media (max-width: 640px) {
    body { padding: 0 .75rem; }
    .bubble { max-width: 95%; }
  }
  @media (prefers-reduced-motion: reduce) {
    .typing i { animation: none; opacity: .6; }
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>Postgrad Advisor</h1>
    <p>Interview → shortlist → CV fit</p>
  </div>
  <button id="theme" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  </button>
</header>
<div id="log" aria-live="polite"></div>
<form id="form" autocomplete="off">
  <div id="chip" hidden>
    <span id="chipname"></span>
    <button id="chipx" type="button" aria-label="Remove attached CV" title="Remove">&times;</button>
  </div>
  <div class="composer">
    <textarea id="msg" rows="1" placeholder="Type your answer…" disabled></textarea>
    <label for="cv">CV<input id="cv" type="file" accept=".pdf,.txt"></label>
    <button id="send" disabled>Send</button>
  </div>
</form>
<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const msg = document.getElementById("msg");
const sendBtn = document.getElementById("send");
const cv = document.getElementById("cv");
const chip = document.getElementById("chip");
const chipName = document.getElementById("chipname");
let over = false;
let attachment = null;  // {path, name} held until the user's next Send (AC 1)
let streamGeneration = 0;

// AC 5, the one fixed line this page owns rather than app/prompts.py: after the
// run is over the graph sits at END, so no graph turn exists to say this.
// Route-agnostic on purpose: TWO paths set `over`. The fit run finishing is one;
// the interview hitting MAX_TURNS is the other (graph.py returns ended=True, the
// router sends it to END, so snapshot.next is empty and the server reports
// "over"). On that second path no verdicts ran and there may be no earlier CV at
// all, so copy naming the verdicts would be false — the same defect class as
// offline being reported as quota exhaustion.
const CV_AFTER_OVER =
  "This chat has already finished, so a new CV can't change anything in it. " +
  "Reload the page to start a fresh one and send it there.";

function showChip() {
  chip.hidden = !attachment;
  if (attachment) chipName.textContent = attachment.name;
}

const atBottom = () => log.scrollHeight - log.scrollTop - log.clientHeight < 40;
const toBottom = () => { log.scrollTop = log.scrollHeight; };

// Only follow new content when the reader is already at the bottom (AC 4).
function add(role, text) {
  const row = document.createElement("div");
  row.className = "row " + role;
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;
  row.append(bubble);
  const stick = atBottom();
  log.append(row);
  if (stick) toBottom();
  return bubble;
}

function addError(text, retryWith) {
  const bubble = add("error", text);
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "retry";
  btn.textContent = "Try again";
  btn.addEventListener("click", () => {
    btn.closest(".row").remove();
    send(...retryWith);  // [wire text, what the bubble showed]
  });
  bubble.parentElement.append(btn);
}

function openPlaceholder(bubble) {
  const ph = document.createElement("span");
  ph.className = "ph";
  ph.innerHTML = '<span class="typing"><i></i><i></i><i></i></span><span class="ph-line"></span>';
  const line = ph.querySelector(".ph-line");
  line.textContent = "thinking…";
  bubble.append(ph);
  return { line, drop: () => ph.remove() };
}

function setBusy(busy) {
  msg.disabled = sendBtn.disabled = busy || over;
  // NOT `|| over`: the upload control stays clickable once the run is over so
  // picking a file can still surface CV_AFTER_OVER (AC 5).
  cv.disabled = busy;
  // autofocus on a phone summons the keyboard over the conversation (AC 7)
  if (!busy && !over && matchMedia("(min-width: 640px)").matches) msg.focus();
}

// One SSE event block ("event: x" + "data: ..." lines) -> per-turn state.
function handleEvent(block, state) {
  let event = "message", data = [];
  for (const line of block.split("\n")) {
    if (line.startsWith("event: ")) event = line.slice(7);
    else if (line.startsWith("data: ")) data.push(line.slice(6));
  }
  const text = data.join("\n");
  if (["token", "message", "status"].includes(event)) state.touch();
  if (event === "token") state.queue += text;
  else if (event === "message")
    // typeFinals: paint it like a streamed reply. finish() then keeps the draft,
    // since nothing in finals replaces it and the bubble has text.
    if (state.typeFinals) state.queue += text;
    else state.finals.push(["ai", text]);
  else if (event === "status") {
    if (state.status && state.status !== text) state.trace.push(state.status);
    state.status = text;
    state.traceEl.textContent = state.trace.join(" › ");
    if (state.statusLine) state.statusLine.textContent = text;
  } else if (event === "error") {
    state.terminal();
    let error = { kind: "unknown", message: text };
    try {
      const parsed = JSON.parse(text);
      if (parsed && typeof parsed.message === "string") error = parsed;
    } catch (_) { /* legacy plain-text payload */ }
    state.errorKind = error.kind || "unknown";
    state.finals.push(["error", error.message]);
  } else if (event === "done") {
    state.terminal();
    if (state.status) state.trace.push(state.status);
    state.traceEl.textContent = state.trace.join(" › ");
    state.status = "";
    if (text === "over") over = true;
  }
}

// Streamed tokens paint from a queue at a readable pace, not per network
// event: free-tier models answer a short question in one <150ms burst after a
// silent prefix (rate limiter + parse), so per-event painting is an invisible
// blob. The draft bubble opens at turn start; code-rendered turns (shortlist,
// echo, verdicts) never queue tokens and land as instant blocks via finals.
function startPainter(state) {
  return setInterval(() => {
    if (state.queue) {
      if (state.dropPh) { state.dropPh(); state.dropPh = null; }  // first real token wins
      const n = Math.max(2, Math.ceil(state.queue.length / 40));  // catch up on long backlogs
      const stick = atBottom();
      state.body.textContent += state.queue.slice(0, n);
      state.queue = state.queue.slice(n);
      if (stick) toBottom();
    } else if (state.closed) {
      finish(state);
    }
  }, 25);
}

function finish(state) {
  if (state.finished) return;
  state.finished = true;
  clearInterval(state.painter);
  state.terminal?.();
  if (state.dropPh) { state.dropPh(); state.dropPh = null; }
  if (state.finals.some(([role]) => role === "error")) state.trace = [];
  if (!state.trace.length) state.traceEl.remove();
  // Replace the painted draft with the authoritative messages; keep it when
  // nothing replaces it (mid-stream error: painted prose + error line stay).
  // Placeholder text never counts here, so an error before the first token
  // discards the whole draft bubble (AC 2).
  if (state.finals.some(([role]) => role === "ai") || !state.body.textContent)
    state.draft.remove();
  if (state.trace.length && state.finals.some(([role]) => role === "ai"))
    add("trace", state.trace.join(" › "));
  for (const [role, text] of state.finals) {
    if (role === "error") addError(text, state.sent);
    else add(role, text);
  }
  setBusy(false);
}

// The client-side connection failure is the one cause this page owns; varied
// phrasings so a repeated failure doesn't read as canned (site qa.ts pattern).
const OFFLINE = [
  "I could not reach the server just now. Is it still running?",
  "That did not go through — the server seems unreachable. Try again in a moment.",
  "Lost the connection to the server. Mind trying that again?",
  "Something got in the way of reaching the server. Give it another go.",
];

// `shown` is what the user's bubble displays: with an attachment the wire text
// carries the server-side path, which is noise in the transcript (AC 1).
// `typeFinals` routes code-rendered messages through the painter instead of
// landing them as instant blocks. Used only for the bootstrap turn, whose reply
// is now fixed text: after a typed greeting, the first question appearing
// fully-formed reads as UI chrome rather than the agent speaking.
async function send(message, shown, typeFinals) {
  const generation = ++streamGeneration;
  setBusy(true);
  if (message) add("user", shown || message);
  const draft = add("ai", "");
  const placeholder = openPlaceholder(draft);
  const traceEl = document.createElement("span");
  traceEl.className = "turn-trace";
  let silenceTimer;
  const controller = new AbortController();
  const state = {
    draft: draft.parentElement, body: document.createElement("span"),
    dropPh: placeholder.drop, statusLine: placeholder.line,
    queue: "", finals: [], closed: false, finished: false,
    trace: [], traceEl, status: "", errorKind: "unknown",
    typeFinals,
    sent: [message, shown],  // this turn's send, for a retry button on its error
  };
  state.terminal = () => clearTimeout(silenceTimer);
  state.touch = () => {
    clearTimeout(silenceTimer);
    silenceTimer = setTimeout(() => {
      if (generation !== streamGeneration || state.closed) return;
      state.timedOut = true;
      controller.abort();
      state.queue = "";
      state.trace = [];
      state.traceEl.remove();
      state.status = "";
      if (state.dropPh) { state.dropPh(); state.dropPh = null; }
      state.finals.push(["error", "This turn is taking unusually long. Please try again shortly."]);
      state.closed = true;
    }, 75000);
  };
  draft.append(traceEl, state.body);
  state.painter = startPainter(state);
  try {
    state.touch();
    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message }),
      signal: controller.signal,
    });
    if (!res.ok) {
      const failure = await res.json();
      state.queue = "";
      state.finals.push(["error", failure.detail || "request failed"]);
      state.closed = true;
      state.terminal();
      return;
    }
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      if (generation !== streamGeneration) break;
      buf += decoder.decode(value, { stream: true });
      const blocks = buf.split("\n\n");
      buf = blocks.pop();  // last piece may be incomplete
      blocks.forEach((b) => handleEvent(b, state));
    }
  } catch (e) {
    if (!(state.timedOut && e.name === "AbortError")) {
      state.queue = "";  // connection lost: show the error now, not after a drain
      state.finals.push(["error", OFFLINE[Math.floor(Math.random() * OFFLINE.length)]]);
    }
  }
  state.terminal();
  state.closed = true;  // painter drains the queue, then finish() runs
}

document.getElementById("theme").addEventListener("click", () => {
  const dark = document.documentElement.classList.toggle("dark");
  localStorage.setItem("theme", dark ? "dark" : "light");
});

function grow() {
  msg.style.height = "auto";
  msg.style.height = msg.scrollHeight + "px";
}
msg.addEventListener("input", grow);
msg.addEventListener("keydown", (e) => {  // Enter sends, Shift+Enter newlines (AC 6)
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    form.requestSubmit();
  }
});

form.addEventListener("submit", (e) => {
  e.preventDefault();
  const m = msg.value.trim();
  if ((!m && !attachment) || msg.disabled) return;
  const file = attachment;
  attachment = null;
  showChip();
  msg.value = "";
  grow();
  if (!file) return send(m);
  // The path travels on its own line so the graph can pick it out of whatever
  // the user typed with it; the bubble shows the filename, not the path.
  send(m ? m + "\n" + file.path : file.path,
       m ? m + "\nAttached: " + file.name : "Attached: " + file.name);
});

document.getElementById("chipx").addEventListener("click", () => {
  attachment = null;
  showChip();
});

cv.addEventListener("change", async () => {
  const file = cv.files[0];
  cv.value = "";
  if (!file) return;
  if (over) return void add("ai", CV_AFTER_OVER);  // AC 5: nothing left to run
  setBusy(true);
  const res = await fetch("/upload?name=" + encodeURIComponent(file.name), {
    method: "POST",
    body: file,
  });
  if (!res.ok) {
    add("error", (await res.json()).detail || "upload failed");  // retry = pick another file
    setBusy(false);
    return;
  }
  // AC 1: held as a chip, never auto-sent — the path goes out with the next Send.
  attachment = { path: (await res.json()).path, name: file.name };
  showChip();
  setBusy(false);
});

// Fixed greeting — page-side copy, never LLM output, so it costs no quota and
// cannot leak model text. It is typed through the SAME painter the real turns
// use (no second typing loop) so the landing reads like the agent speaking
// rather than UI chrome, then the first interview turn starts.
const INTRO =
  "I help you find postgraduate programmes — taught master's, research master's, or PhD — " +
  "and judge honestly how you'd fit them.\n\n" +
  "A few questions first, then a shortlist of real universities, then your CV against each one. " +
  "You can attach your CV at any point with the CV button; it is read on this machine.";

function typeIntro() {
  return new Promise((resolve) => {
    setBusy(true);
    const draft = add("ai", "");
    const state = {
      draft: draft.parentElement, body: document.createElement("span"),
      dropPh: null,  // no placeholder: nothing is being waited on, text is ready
      queue: INTRO, finals: [], closed: false, sent: ["", undefined],
    };
    draft.append(state.body);
    // closed stays false on purpose: the shared finish() would call setBusy(false)
    // a tick after the drain, re-enabling input during the interview turn that
    // follows. The intro owns its own teardown instead — drain, stop, resolve.
    state.painter = startPainter(state);
    const watch = setInterval(() => {
      if (state.queue) return;
      clearInterval(watch);
      clearInterval(state.painter);
      resolve();
    }, 25);
  });
}

// greeting, then the interview's fixed first question, typed the same way
typeIntro().then(() => send("", undefined, true));
</script>
</body>
</html>
